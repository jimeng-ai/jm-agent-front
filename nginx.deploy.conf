server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # 公网入口（cloudflared → 10012）不提供运营接口和沙箱内部回调：运营后台只走内网 10014，沙箱回调走宿主机 20011。
  # 用正则而不是前缀：要一并挡住 ;参数（Spring 会当成同一路径，admin 和 operator 两段上都可能带）和大小写变体；
  # 双斜杠、百分号编码（含 %3B）nginx 匹配前已规范化。
  # 正则里有 ";"，必须整体加引号，否则 nginx 会把它当成指令结束符。改这里必须过 scripts/test-nginx-deny.sh（部署流程里会跑）。
  location ~* "^/data/(admin(;[^/]*)?/operator|internal)(/|;|$)" {
    default_type application/json;
    return 403 '{"success":false,"respCode":"403","respMsg":"forbidden"}';
  }

  # 后端代理：必须放在 SPA fallback 之前
  # 独立容器部署：经由 host.docker.internal 访问宿主机上的【生产】data-service。
  # 生产网关对外发布在 20011（容器内 10011）；宿主 10011 留给本地 IDE 调试，与生产隔离。
  location /data/ {
    # 钉死宿主 IPv4 网关：host.docker.internal 在 macOS 上双栈解析，IPv6(fdc4:...::254)
    # 不可达，nginx 会先连 IPv6 失败再重试 IPv4，产生每次首发的连接失败+重试延迟与 error 日志。
    proxy_pass http://192.168.65.254:20011/data/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";

    # SSE 关键配置
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    add_header X-Accel-Buffering no;

    # 文件上传
    client_max_body_size 100m;
  }

  # SPA fallback
  location / {
    try_files $uri $uri/ /index.html;
  }
}
