name: Deploy

# push 到 main 即自动部署。也支持在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 让 GITHUB_TOKEN 有推送 GHCR 镜像的权限（无需额外 secret）
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/spider615/jm-agent-front
  CONTAINER: jm-agent-front
  PORT: 10012

jobs:
  deploy:
    # 跑在本机（Mac）上的自托管 Runner
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .

      # 部署是关键步骤：直接用刚构建的本地镜像重建容器，不依赖镜像仓库可达性。
      # 放在推送之前，保证即使 GHCR 连不上，部署也能成功。
      - name: Redeploy container
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --add-host host.docker.internal:host-gateway \
            -p "$PORT:80" \
            "$IMAGE:latest"

      # 推送到 GHCR 作为归档/回滚备份：best-effort。
      # 本机经代理访问 ghcr.io，Docker daemon 偶发超时也不影响上面的部署结果。
      - name: Push to GHCR (best-effort)
        continue-on-error: true
        # 独立 docker config 目录，避免 macOS 钥匙串凭据助手(credsStore=desktop)在
        # launchd 后台环境下干扰 docker login。注意必须用运行时变量 $RUNNER_TEMP，
        # 不能用 ${{ runner.temp }}——runner 上下文在 workflow 级 env 不可用，会导致
        # 整个 workflow 启动即失败（startup_failure，0 秒、无任何 job）。
        run: |
          export DOCKER_CONFIG="$RUNNER_TEMP/docker-ci"
          mkdir -p "$DOCKER_CONFIG"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      - name: Cleanup old images
        if: always()
        run: docker image prune -f
