name: Deploy

# push 到 main 即自动部署。也支持在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 让 GITHUB_TOKEN 有推送 GHCR 镜像的权限（无需额外 secret）
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jimeng-ai/jm-agent-front
  CONTAINER: jm-agent-front
  PORT: 10012

jobs:
  deploy:
    # 跑在本机（Mac）上的自托管 Runner
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # macOS 自托管 Runner 跑在 launchd 后台会话里，默认 ~/.docker/config.json 的
      # credsStore=desktop 会去访问登录钥匙串；无人交互时报 "keychain cannot be accessed"，
      # 连 docker build 拉公共基础镜像（node/nginx）都会失败。这里指向一个干净的 DOCKER_CONFIG
      # （config.json={}，无 credsStore），让后续所有 docker 命令都不走钥匙串助手——公共镜像匿名拉取，
      # GHCR 登录则把凭据以 base64 写进该配置照常可用。写入 $GITHUB_ENV 让后续每个 step 都继承。
      - name: Prepare clean docker config (bypass macOS keychain)
        run: |
          DC="$RUNNER_TEMP/docker-ci"
          mkdir -p "$DC"
          printf '{}' > "$DC/config.json"
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      # --memory 是安全围栏，不是优化：这台机器就是 prod，Docker VM 只有 7.75G 且常驻容器
      # （ds-data-server 1.2G、ds-elasticsearch 1G、ds-nacos 850M…）已吃掉大半。构建一旦把内存
      # 打爆，Linux OOM killer 按 RSS 挑人杀——目前构建进程最大所以死的是它自己，但那是概率不是
      # 保证，哪次后端容器正好涨上去，被杀的就是 prod。加了 cgroup 上限后超限只会杀构建自己。
      # memory-swap 设成与 memory 相同 = 不给构建 swap（VM 的 1G swap 长期用满，再挤会全局 thrash）。
      # 注意：本 step 的 DOCKER_CONFIG 是干净目录，buildx 插件不会被发现，走的是 legacy builder，
      # --memory 才生效；BuildKit/buildx 会忽略该 flag。
      - name: Build image
        run: |
          docker build \
            --memory=2048m --memory-swap=2048m \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .

      # 部署是关键步骤：直接用刚构建的本地镜像重建容器，不依赖镜像仓库可达性。
      # 放在推送之前，保证即使 GHCR 连不上，部署也能成功。
      - name: Redeploy container
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --add-host host.docker.internal:host-gateway \
            -p "$PORT:80" \
            "$IMAGE:latest"

      # 推送到 GHCR 作为归档/回滚备份：best-effort。
      # 直接把凭据 base64 写进干净的 DOCKER_CONFIG（不调 docker login），彻底不碰 macOS 钥匙串
      # ——headless 会话里 docker login 存储凭据会报 "-25308 User interaction is not allowed"。
      - name: Push to GHCR (best-effort)
        continue-on-error: true
        run: |
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # 多个仓库的部署并行跑在同一 Docker daemon 上，prune 有全局锁，并发会撞
      # "a prune operation is already running"。这是无害的清理步骤，失败不应判部署失败。
      - name: Cleanup old images
        if: always()
        continue-on-error: true
        run: docker image prune -f
