name: Deploy

# push 到 main 即自动部署。也支持在 Actions 页面手动触发。
on:
  push:
    branches: [main]
  workflow_dispatch:

# 让 GITHUB_TOKEN 有推送 GHCR 镜像的权限（无需额外 secret）
permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-main
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/jimeng-ai/jm-agent-front
  CONTAINER: jm-agent-front
  PORT: 10012

jobs:
  deploy:
    # 跑在本机（Mac）上的自托管 Runner
    runs-on: [self-hosted, macOS]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---- 前端构建跑在宿主机原生环境，【不】进 Docker ----
      # 这台机器就是 prod：Docker VM 只有 7.75G，ds-data-server(1.2G)/ds-elasticsearch(1G)/
      # ds-nacos(850M) 等常驻容器占掉大半，available 长期只剩 ~1.6G；而引入 mermaid 后
      # vite build 峰值需要 ≥1.5G。实测四组参数都过不去：
      #   堆1536+围栏2048m → 全局 OOM(围栏比余量还高，压根没触发)，node 在 1.40G 被杀
      #   堆1024+围栏1280m → V8 干净报 heap out of memory，1024 确实不够
      #   堆1280+围栏1500m → cgroup 在 1.30G 杀掉，仍不够
      #   堆1536(临时停 kibana 腾到 2.1G) → 唯一成功的一次
      # 即"构建能成功"和"围栏低于余量、不连累 prod"这两个区间没有交集。而宿主机有 16G，
      # 且 macOS 是内存压缩而不是 OOM killer 挑进程杀，不会误伤 prod 容器。
      # 于是 Docker 这边只剩把 dist 装进 nginx(Dockerfile.dist)，内存开销可忽略。
      # 不加 cache: npm —— 依赖走 .npmrc 里的 npmmirror，装一次只要几秒，
      # 而 Actions 缓存要跟 GitHub 传输，在这里反而更慢。
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Build front (on host)
        run: |
          npm ci
          npm run build

      # macOS 自托管 Runner 跑在 launchd 后台会话里，默认 ~/.docker/config.json 的
      # credsStore=desktop 会去访问登录钥匙串；无人交互时报 "keychain cannot be accessed"，
      # 连 docker build 拉公共基础镜像（node/nginx）都会失败。这里指向一个干净的 DOCKER_CONFIG
      # （config.json={}，无 credsStore），让后续所有 docker 命令都不走钥匙串助手——公共镜像匿名拉取，
      # GHCR 登录则把凭据以 base64 写进该配置照常可用。写入 $GITHUB_ENV 让后续每个 step 都继承。
      - name: Prepare clean docker config (bypass macOS keychain)
        run: |
          DC="$RUNNER_TEMP/docker-ci"
          mkdir -p "$DC"
          printf '{}' > "$DC/config.json"
          echo "DOCKER_CONFIG=$DC" >> "$GITHUB_ENV"

      # 只做镜像组装：把上一步在宿主机产出的 dist 复制进 nginx。没有 vite、没有 node，
      # 内存开销可忽略，因此不再需要 --memory 围栏（围栏是给会吃内存的构建准备的）。
      - name: Build image
        run: |
          docker build -f Dockerfile.dist \
            -t "$IMAGE:latest" \
            -t "$IMAGE:${{ github.sha }}" \
            .

      # 部署是关键步骤：直接用刚构建的本地镜像重建容器，不依赖镜像仓库可达性。
      # 放在推送之前，保证即使 GHCR 连不上，部署也能成功。
      - name: Redeploy container
        run: |
          docker rm -f "$CONTAINER" 2>/dev/null || true
          docker run -d \
            --name "$CONTAINER" \
            --restart unless-stopped \
            --add-host host.docker.internal:host-gateway \
            -p "$PORT:80" \
            "$IMAGE:latest"

      # 推送到 GHCR 作为归档/回滚备份：best-effort。
      # 直接把凭据 base64 写进干净的 DOCKER_CONFIG（不调 docker login），彻底不碰 macOS 钥匙串
      # ——headless 会话里 docker login 存储凭据会报 "-25308 User interaction is not allowed"。
      - name: Push to GHCR (best-effort)
        continue-on-error: true
        run: |
          AUTH=$(printf '%s' "${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}" | base64 | tr -d '\n')
          printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$AUTH" > "$DOCKER_CONFIG/config.json"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

      # 多个仓库的部署并行跑在同一 Docker daemon 上，prune 有全局锁，并发会撞
      # "a prune operation is already running"。这是无害的清理步骤，失败不应判部署失败。
      - name: Cleanup old images
        if: always()
        continue-on-error: true
        run: docker image prune -f
